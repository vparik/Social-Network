server {
    listen 80;

    # Serve static frontend files from the web/ directory
    root /usr/share/nginx/html;
    index index.html;

    # Static assets (JS, CSS, images) — served directly by nginx
    location /js/ {
        try_files $uri =404;
    }

    location /css/ {
        try_files $uri =404;
    }

    location /images/ {
        try_files $uri =404;
    }

    # Proxy REST API to the backend container
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy WebSocket connections (chat / notifications)
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Proxy uploaded files stored on the backend
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # SPA fallback — every other path serves index.html so the JS router works
    location / {
        try_files $uri /index.html;
    }
}
