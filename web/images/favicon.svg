<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e25555"/>
      <stop offset="100%" stop-color="#2ec4b6"/>
    </linearGradient>
    <linearGradient id="bggrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2229"/>
      <stop offset="100%" stop-color="#181b21"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="102" fill="url(#bggrad)"/>
  <!-- Subtle teal top-left glow -->
  <ellipse cx="180" cy="140" rx="260" ry="200" fill="rgba(46,196,182,0.05)"/>
  <!-- Subtle red bottom-right glow -->
  <ellipse cx="370" cy="390" rx="220" ry="180" fill="rgba(226,85,85,0.06)"/>
  <!-- Thin teal top accent line -->
  <line x1="100" y1="0" x2="412" y2="0" stroke="rgba(46,196,182,0.45)" stroke-width="5" stroke-linecap="round"/>
  <!-- Subtle border -->
  <rect width="512" height="512" rx="102" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="4"/>
  <!-- SN text -->
  <text x="256" y="360" text-anchor="middle"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-weight="700" font-size="290" letter-spacing="-18"
    fill="url(#g)">SN</text>
  <!-- Corner dots -->
  <circle cx="448" cy="464" r="10" fill="#2ec4b6" opacity="0.45"/>
  <circle cx="64"  cy="48"  r="10" fill="#e25555" opacity="0.35"/>
</svg>
